# ==============================================================================
# SwordNex AI CRM — PostgreSQL 16 Production Configuration
# WAL Archiving, PITR, Connection Pool, and Resource Sizing
# ==============================================================================

# Network & Connections
listen_addresses = '*'
max_connections = 200

# Memory & Caching (Configured for 2GB - 4GB RAM host baseline)
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 16MB
maintenance_work_mem = 64MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

# Write Ahead Logging (WAL) & Point-In-Time Recovery (PITR)
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
archive_timeout = 300 # Forces WAL segment switch every 5 minutes (RPO <= 5m)

# Logging & Auditing
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

# Locale & Formatting
datestyle = 'iso, mdy'
timezone = 'UTC'
default_text_search_config = 'pg_catalog.english'
