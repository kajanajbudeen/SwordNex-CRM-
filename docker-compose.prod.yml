version: '3.8'

# ==============================================================================
# SwordNex AI CRM — Hardened Production Docker Compose Architecture
# - Private Database Network (Zero Public 5432 Exposure)
# - Dedicated Migration Init Container (Zero Concurrent Migration Race Conditions)
# - Persistent Volumes for Data, WAL Archiving, Backups, and Uploads
# - Non-Root Execution, Pinned Base Images & Container Healthchecks
# ==============================================================================

networks:
  crm_db_network:
    driver: bridge
    internal: true # STRICT: Database isolated from the public internet
  crm_app_network:
    driver: bridge

volumes:
  swordnex_pgdata:
    name: swordnex_pgdata
  swordnex_wal_archive:
    name: swordnex_wal_archive
  swordnex_backups:
    name: swordnex_backups
  swordnex_uploads:
    name: swordnex_uploads

services:
  # ----------------------------------------------------------------------------
  # TIER 1: DATABASE (PostgreSQL 16 with WAL Archiving for PITR)
  # ----------------------------------------------------------------------------
  database:
    image: postgres:16-alpine
    container_name: swordnex_prod_database
    restart: unless-stopped
    networks:
      - crm_db_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swordnex_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB:-swordnex_crm}
    volumes:
      - swordnex_pgdata:/var/lib/postgresql/data
      - swordnex_wal_archive:/var/lib/postgresql/wal_archive
      - swordnex_backups:/var/lib/postgresql/backups
      - ./database/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/scripts:/var/lib/postgresql/scripts:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swordnex_admin} -d ${POSTGRES_DB:-swordnex_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # DATABASE MIGRATION INIT CONTAINER (Executes exactly once prior to API boot)
  # ----------------------------------------------------------------------------
  migration:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: swordnex_prod_migration
    restart: "no"
    networks:
      - crm_db_network
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    command: ["sh", "-c", "if [ -f \"$$DATABASE_URL_FILE\" ]; then export DATABASE_URL=\"$$(cat \"$$DATABASE_URL_FILE\")\"; fi; npx prisma migrate deploy"]

  # ----------------------------------------------------------------------------
  # TIER 2: BACKEND REST API SERVER (Node.js 20 / Express / Prisma)
  # ----------------------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: swordnex_prod_backend
    restart: unless-stopped
    networks:
      - crm_db_network
      - crm_app_network
    depends_on:
      database:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_REFRESH_SECRET_FILE: /run/secrets/jwt_refresh_secret
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CLIENT_URL: ${CLIENT_URL:-https://crm.yourdomain.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://crm.yourdomain.com}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-loopback,linklocal,uniquelocal}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET_FILE: /run/secrets/razorpay_key_secret
      RAZORPAY_WEBHOOK_SECRET_FILE: /run/secrets/razorpay_webhook_secret
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      SMTP_FROM: ${SMTP_FROM:-SwordNex AI CRM <no-reply@yourdomain.com>}
    volumes:
      - swordnex_uploads:/app/uploads
    secrets:
      - database_url
      - jwt_secret
      - jwt_refresh_secret
      - razorpay_key_secret
      - razorpay_webhook_secret
      - smtp_password
    # Published strictly to localhost loopback so host Nginx can reach it if needed
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ----------------------------------------------------------------------------
  # TIER 3: FRONTEND CLIENT (React / Tailwind / Pinned Nginx Alpine)
  # ----------------------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: swordnex_prod_frontend
    restart: unless-stopped
    networks:
      - crm_app_network
    depends_on:
      server:
        condition: service_healthy
    # Published to localhost loopback for Host Nginx reverse proxy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  db_password:
    file: ./secrets/db_password.txt
  database_url:
    file: ./secrets/database_url.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  jwt_refresh_secret:
    file: ./secrets/jwt_refresh_secret.txt
  razorpay_key_secret:
    file: ./secrets/razorpay_key_secret.txt
  razorpay_webhook_secret:
    file: ./secrets/razorpay_webhook_secret.txt
  smtp_password:
    file: ./secrets/smtp_password.txt
