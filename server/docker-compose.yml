version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swordnex_backend_server
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      API_PREFIX: /api/v1
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgrespassword@localhost:5432/swordnex_crm?schema=public}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_for_swordnex_crm_production_needs_32_bytes_min}
      JWT_EXPIRES_IN: 1d
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_refresh_jwt_key_for_swordnex_crm_prod}
      JWT_REFRESH_EXPIRES_IN: 7d
      AI_PROVIDER: ${AI_PROVIDER:-mock}
    ports:
      - "5000:5000"
